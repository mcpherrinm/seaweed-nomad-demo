# Public, read-only HTTPS front end for one SeaweedFS bucket ("public").
#
# Access control lives in SeaweedFS, not here: the bucket has a policy that
# lets anonymous callers s3:GetObject, and nothing else. nginx sends requests
# without credentials, so it can never do more than the public can. Its jobs
# are to pin requests to that one bucket, allow only plain GET/HEAD of objects,
# and keep clients from reaching the S3 API directly.
#
# PRODUCTION: a real certificate; proxy_cache (and maybe a CDN) so popular
# objects don't hit SeaweedFS every time; rate limits; access logs; and
# SeaweedFS's S3 port reachable only from nginx and your apps.

worker_processes auto;
events {}

http {
  server_tokens off;

  upstream seaweed_s3 {
    server seaweed:8333;
    keepalive 16;
  }

  server {
    listen 8443 ssl;
    server_name localhost nginx;

    ssl_certificate     /pki/cert.pem;
    ssl_certificate_key /pki/key.pem;

    # Verify SeaweedFS's certificate on the way upstream.
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /pki/ca.crt;
    proxy_ssl_name                seaweed;
    proxy_ssl_server_name         on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host seaweed;
    # Always anonymous upstream, whatever the client sent.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    # Don't leak S3 implementation details to the public.
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header Server;

    # Query strings select other S3 operations (?acl, ?policy, ?list-type=2,
    # ?uploads, presigned ?X-Amz-*), so refuse them outright.
    if ($args != "") {
      return 400;
    }

    location = / {
      limit_except GET { deny all; }  # GET implies HEAD
      proxy_pass https://seaweed_s3/public/index.html;
    }

    # With a static proxy_pass URI, nginx replaces the matched "/" prefix with
    # "/public/" using the normalised path, so "../" can't escape the bucket.
    location / {
      limit_except GET { deny all; }
      proxy_pass https://seaweed_s3/public/;
    }
  }
}
